name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Locale tests
        run: flutter test test/locale_test.dart
      - name: Create open-source build secrets
        run: |
          cat > lib/secrets.dart <<'EOF'
          import 'package:xcnav/endpoint.dart';

          const String datadogToken = 'unset';
          const String datadogRumAppId = 'unset';
          const String profileStoreUrl = 'unset';
          const String profileStoreToken = 'unset';

          final Endpoint reflectorNorthAmerica =
              Endpoint(apiUrl: 'unset', token: 'unset', cert: 'unset');
          EOF
      # Keep one debug signing key across CI runs. Without this, each fresh
      # GitHub runner creates a different key and Android refuses the next APK
      # as an update ("App not installed").
      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mfateh-debug-signing-v1
      - name: Ensure test signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=M-Fateh Test,O=M-Fateh,C=SE"
          fi
      - name: Build APK
        run: flutter build apk --release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: M-Fateh-APK
        run: |
          set -euo pipefail
          artifact_rows="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name] | @tsv')"
          while IFS=$'\t' read -r artifact_id artifact_name; do
            [[ -z "$artifact_id" ]] && continue
            if [[ "$artifact_name" == "$ARTIFACT_NAME" ]]; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id" >/dev/null
              echo "Deleted previous artifact $artifact_id ($artifact_name)"
            fi
          done <<< "$artifact_rows"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Fateh-APK
          retention-days: 7
          path: build/app/outputs/flutter-apk/app-release.apk
