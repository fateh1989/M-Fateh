name: Android APK

on:
  push:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Locale tests
        run: flutter test test/locale_test.dart
      - name: Create open-source build secrets
        run: |
          cat > lib/secrets.dart <<'EOF'
          import 'package:xcnav/endpoint.dart';

          const String datadogToken = 'unset';
          const String datadogRumAppId = 'unset';
          const String profileStoreUrl = 'unset';
          const String profileStoreToken = 'unset';

          final Endpoint reflectorNorthAmerica =
              Endpoint(apiUrl: 'unset', token: 'unset', cert: 'unset');
          EOF
      - name: Restore stable M-Fateh signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: mfateh-debug-signing-v1
      - name: Ensure stable M-Fateh signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=M-Fateh Test,O=M-Fateh,C=SE"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"
      - name: Save stable M-Fateh signing key
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: mfateh-debug-signing-v1
      - name: Force release signing to use the stable Build 11 key
        run: |
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/debug.keystore
          EOF
      - name: Build APK
        run: flutter build apk --release
      - name: Verify APK identity and signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -o -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep '^package:'
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -F 'certificate SHA-256 digest: 2f4bafafa0eb663ccd76855cc5b513c0502c314192774dd9725f5d6077f72140'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Fateh-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish direct-download APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk M-Fateh.apk
          gh release delete test-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create test-latest M-Fateh.apk --title "M-Fateh Test APK" --notes "Latest test build. Signed with the stable M-Fateh v1 test key."
