name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Locale tests
        run: flutter test test/locale_test.dart
      - name: Create open-source build secrets
        run: |
          cat > lib/secrets.dart <<'EOF'
          import 'package:xcnav/endpoint.dart';

          const String datadogToken = 'unset';
          const String datadogRumAppId = 'unset';
          const String profileStoreUrl = 'unset';
          const String profileStoreToken = 'unset';

          final Endpoint reflectorNorthAmerica =
              Endpoint(apiUrl: 'unset', token: 'unset', cert: 'unset');
          EOF
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Fateh-APK
          path: build/app/outputs/flutter-apk/app-release.apk
